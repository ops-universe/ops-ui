name: Generate dependency lockfile evidence
on:
  push:
    branches: [feat/reproducible-dependencies]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit generated lockfile
        run: |
          echo LOCKFILE_BEGIN
          cat package-lock.json
          echo LOCKFILE_END
      - name: Audit dependencies
        run: npm audit --json > audit.json || test -s audit.json
      - run: node -e 'const a=require("./audit.json"); console.log(JSON.stringify(a.metadata)); console.log(JSON.stringify(a.vulnerabilities))'
